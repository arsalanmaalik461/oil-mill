name: oilmill
description: "Namat Oil Mill - complete business khata app: party ledger, cash book, stock book, bill book, staff book, bank book, expenses, DigiCash and reports."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  intl: ^0.19.0
  pdf: ^3.11.0
  printing: ^5.13.1
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  local_auth: ^2.2.0
  qr_flutter: ^4.1.0
  crypto: ^3.0.3
  file_picker: ^8.0.3
  flutter_contacts: ^1.1.9+2
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.11
  http: ^1.2.2
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#F05623"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

dependency_overrides:
  archive: ^4.6.0
  sqflite_android: 2.4.1

